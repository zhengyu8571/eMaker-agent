server:
  port: 8085
  tomcat:
    uri-encoding: UTF-8
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: message-service
tj:
  swagger:
    enable: true
    enableResponseWrap: true
    package-path: com.tianji.message.controller
    title: 天机学堂 - 消息中心接口文档
    description: 该服务用于站内信、通知管理、短信发送等功能
    contact-name: eMaker Agent Showcase
    contact-url: https://example.com
    contact-email: maintainer@example.com
    version: v1.0
  auth:
    resource:
      enable: true
      excludeLoginPaths:
      - /students/register
      - /users/detail/{isStaff}
      - /users/list
      - GET:/users/{id}
      - /users/{id}/type
      - /users/ids
  jdbc:
    database: tj_message
  sms:
    ali:
      accessId: ${SHOWCASE_TJ_SMS_ALI_ACCESSID}
      accessSecret: ${SHOWCASE_TJ_SMS_ALI_ACCESSSECRET}
