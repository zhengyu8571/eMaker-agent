server:
  port: 8086
  tomcat:
    uri-encoding: UTF-8
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: course-service
  main:
    allow-circular-references: true
tj:
  swagger:
    enable: true
    package-path: com.tianji.course.controller
    title: 天机学堂 - 课程系统接口文档
    description: 该服务包含课程管理相关功能
    contact-name: eMaker Agent Showcase
    contact-url: https://example.com
    contact-email: maintainer@example.com
    version: v1.0
    enableResponseWrap: true
  auth:
    resource:
      enable: false
  jdbc:
    database: tj_course
