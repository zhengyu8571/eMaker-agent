server:
  port: 8082
  tomcat:
    uri-encoding: UTF-8
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: user-service
tj:
  swagger:
    enable: true
    enableResponseWrap: true
    package-path: com.tianji.user.controller
    title: 天机学堂 - 用户中心接口文档
    description: 该服务用户管理、用户信息管理
    contact-name: eMaker Agent Showcase
    contact-url: https://example.com
    contact-email: maintainer@example.com
    version: v1.0
  auth:
    resource:
      enable: false
      excludeLoginPaths:
      - /students/register
      - /users/detail/{isStaff}
      - /users/list
      - GET:/users/{id}
      - /users/{id}/type
      - /users/ids
      - /users/me
  jdbc:
    database: tj_user
