server:
  port: 8081
  tomcat:
    uri-encoding: UTF-8
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: auth-service
encrypt:
  key-store:
    alias: ${JWT_KEY_ALIAS:showcase-signing}
    location: ${JWT_KEYSTORE_LOCATION:file:./config/keys/demo-signing.p12}
    password: ${JWT_KEYSTORE_PASSWORD}
    secret: ${JWT_KEY_PASSWORD}
tj:
  swagger:
    enable: true
    enableResponseWrap: true
    package-path: com.tianji.auth.controller
    title: 天机学堂 - 权限微服务接口文档
    description: 该服务用于管理权限相关信息
    contact-name: eMaker Agent Showcase
    contact-url: https://example.com
    contact-email: maintainer@example.com
    version: v1.0
  auth:
    resource:
      enable: true
      includeLoginPaths:
      - /menus/me
      - /accounts/logout
  jdbc:
    database: tj_auth
